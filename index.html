<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accesos Rápidos y Formularios</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0b132b;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .container {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }
    .profile-title {
      font-size: 1.45rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #ffffff;
      letter-spacing: -0.3px;
    }
    .profile-bio {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .links-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .link-button {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      background-color: #1c2541;
      color: #ffffff;
      text-decoration: none;
      padding: 16px 20px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 600;
      border: 1px solid #3a506b;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.25);
      transition: all 0.2s ease;
      text-align: left;
    }
    .link-button span.icon {
      font-size: 1.35rem;
      margin-right: 14px;
      display: inline-block;
      flex-shrink: 0;
    }
    .link-button:hover, .link-button:active {
      background-color: #3a506b;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px -2px rgba(0, 0, 0, 0.35);
    }
    .footer {
      margin-top: 30px;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="profile-title">Portal de Operaciones</h1>
    <p class="profile-bio">Selecciona el formulario o sistema a ingresar:</p>

    <div class="links-group">
      <!-- 1. Reporte Salud Diario -->
      <a href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=RR2fBB68PUe6-XYwgUVGsHvVeJ01pWdNnfmYYtrfjA9UNTRFWUtHUURUOVQ0OUFZOFNMTEZCRkYyTi4u&origin=QRCode" target="_blank" class="link-button">
        <span class="icon">🩺</span>
        <span>Reporte Salud Diario</span>
      </a>

      <!-- 2. Registro Neumáticos -->
      <a href="https://forms.cloud.microsoft/pages/responsepage.aspx?id=RR2fBB68PUe6-XYwgUVGsHvVeJ01pWdNnfmYYtrfjA9UNDBOWllLT01GR1dFQkJFWFMxUklDUUtTUS4u&route=shorturl" target="_blank" class="link-button">
        <span class="icon">🛞</span>
        <span>Registro Neumáticos</span>
      </a>

      <!-- 3. Check List Conducción -->
      <a href="https://www.directic.cl/BeSafe/checklistpi/home.aspx" target="_blank" class="link-button">
        <span class="icon">📋</span>
        <span>Check List Conducción</span>
      </a>

      <!-- 4. EDC -->
      <a href="https://www.directic.cl/Besafe/DirecticHome/frm_defaultDetalle.aspx?id_padre=844" target="_blank" class="link-button">
        <span class="icon">🔍</span>
        <span>EDC</span>
      </a>
    </div>

    <div class="footer">
      Acceso vía Chip NFC
    </div>
  </div>
</body>
</html>
